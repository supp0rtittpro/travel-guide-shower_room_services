<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJ MALL - การเดินทาง</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="images/logo.png" alt="JJ MALL Logo" class="logo" onerror="this.src='https://placehold.co/150x50/06C755/white?text=JJ+MALL'">
        </div>
        <h1 id="ui-title">การเดินทางมายังจุดบริการ</h1>
        <p id="ui-subtitle">ห้องอาบน้ำ</p>
        
        <button id="langToggleBtn">EN</button>
    </header>

    <div class="container">
        <div class="selection-menu">
            <button class="menu-btn active" onclick="selectCategory('car')" id="btn-car">
                <i class="fa-solid fa-car"></i>
                <span id="txt-car">รถยนต์</span>
            </button>
            <button class="menu-btn" onclick="selectCategory('bike')" id="btn-bike">
                <i class="fa-solid fa-motorcycle"></i>
                <span id="txt-bike">มอเตอร์ไซค์</span>
            </button>
            <button class="menu-btn" onclick="selectCategory('walk')" id="btn-walk">
                <i class="fa-solid fa-person-walking"></i>
                <span id="txt-walk">เดินเท้า</span>
            </button>
        </div>

        <div class="content-card" id="content-container">
            </div>
    </div>

    <div id="imageModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <button class="modal-btn modal-prev" onclick="changeModalImage(-1)"><i class="fa-solid fa-chevron-left"></i></button>
        <img class="modal-content" id="img01">
        <button class="modal-btn modal-next" onclick="changeModalImage(1)"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <footer>
        &copy; 2026 JJ MALL. All rights reserved.
    </footer>

    <script src="script.js"></script>
</body>
</html>
