<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วิธีการเดินทาง - JJ MALL</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <button id="langToggleBtn" onclick="toggleLanguage()">EN</button>
        
        <div class="logo-container">
            <img src="images/logo.png" alt="JJ Mall Logo" class="logo">
        </div>
        <h1><i class="fa-solid fa-map-location-dot"></i> <span id="ui-title">วิธีการเดินทาง</span></h1>
        <p id="ui-subtitle">เลือกประเภทการเดินทางของคุณ</p>
    </header>

    <main class="container">
        <nav class="selection-menu">
            <button class="menu-btn active" id="btn-car" onclick="showContent('car', this)">
                <i class="fa-solid fa-car"></i><span id="ui-menu-car">รถยนต์</span>
            </button>
            <button class="menu-btn" id="btn-bike" onclick="showContent('bike', this)">
                <i class="fa-solid fa-motorcycle"></i><span id="ui-menu-bike">มอเตอร์ไซค์</span>
            </button>
            <button class="menu-btn" id="btn-walk" onclick="showContent('walk', this)">
                <i class="fa-solid fa-person-walking"></i><span id="ui-menu-walk">เดินเท้า</span>
            </button>
        </nav>

        <section id="content-display" class="content-card">
            <div id="content-body">
                </div>
        </section>
    </main>

    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close">&times;</span>
        <img class="modal-content" id="imgFull">
        <div id="caption"></div>
    </div>

    <footer>
        <p id="ui-footer">&copy; 2026 JJ MALL - Shower Room Services</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
